name: Modeller.Api container

on:
  push:
    branches: [main]
    paths:
      - "src/Modeller.Api/**"
      - "src/Modeller.Initiative/**"
      - "src/Modeller.Initiative.OpenAICompatible/**"
      - "src/Modeller.Workspace/**"
      - "src/Modeller.Parsing/**"
      - "src/Modeller.Configuration/**"
      - "src/Modeller.Projections/**"
      - "src/Modeller.Contexts/**"
      - "src/Modeller.Validation/**"
      - "src/Modeller.Model/**"
      - "tests/Modeller.Api.Tests/**"
      - "tests/Modeller.Initiative.Tests/**"
      - "tests/Modeller.Initiative.OpenAICompatible.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "Dockerfile.vercel"
      - "global.json"
      - "Modeller.slnx"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/Modeller.Api/**"
      - "src/Modeller.Initiative/**"
      - "src/Modeller.Initiative.OpenAICompatible/**"
      - "src/Modeller.Workspace/**"
      - "src/Modeller.Parsing/**"
      - "src/Modeller.Configuration/**"
      - "src/Modeller.Projections/**"
      - "src/Modeller.Contexts/**"
      - "src/Modeller.Validation/**"
      - "src/Modeller.Model/**"
      - "tests/Modeller.Api.Tests/**"
      - "tests/Modeller.Initiative.Tests/**"
      - "tests/Modeller.Initiative.OpenAICompatible.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "Dockerfile.vercel"
      - "global.json"
      - "Modeller.slnx"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Report .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Modeller.slnx

      - name: Build Modeller.Api
        run: dotnet build src/Modeller.Api/Modeller.Api.csproj --no-restore

      - name: Test Modeller.Api
        run: dotnet test tests/Modeller.Api.Tests/Modeller.Api.Tests.csproj --no-restore

  # Builds the image as a smoke check only — no registry credentials are configured, so nothing
  # is pushed. See docs/architecture/decisions/hosted-workspace-api.mdx for the deployment story.
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f src/Modeller.Api/Dockerfile -t modeller-api:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --rm -p 8080:8080 -e PORT=8080 --name modeller-api-ci modeller-api:ci
          for attempt in $(seq 1 10); do
            if curl -sf http://localhost:8080/healthz/live; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/healthz/live
          curl -sf http://localhost:8080/v1/workspace/supported-views
          docker stop modeller-api-ci

  deploy:
    runs-on: ubuntu-latest
    needs: [test, container]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Prefer remote deploy over `vercel build` + `--prebuilt` so Sensitive
      # project env vars stay available in Vercel's build container.
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}

      # A deployment can build cleanly, pass the local container smoke test above, and still fail
      # to serve any traffic once Vercel actually runs it (seen 2026-08-20: every route, including
      # /healthz/live, returned 500 INTERNAL_FUNCTION_INVOCATION_FAILED with no application logs at
      # all — the container never started under Vercel despite an identical `docker run` working).
      # That failure mode is invisible to the steps above, so it went unnoticed until a human
      # checked the live site. Fail the workflow — and thus notify — the moment the production
      # alias itself doesn't come up healthy after a deploy.
      - name: Verify the live production deployment is healthy
        run: |
          for attempt in $(seq 1 10); do
            if curl -sf https://modeller-next.vercel.app/healthz/live; then break; fi
            echo "Attempt $attempt: production not healthy yet, retrying..."
            sleep 6
          done
          curl -sf https://modeller-next.vercel.app/healthz/live
          curl -sf https://modeller-next.vercel.app/v1/workspace/supported-views

      # Every deploy pushes a new, immutable image tagged by commit SHA (never overwritten — Vercel
      # needs each one to keep rollback/promote working for past deployments). Left unpruned, the
      # "dockerfile" repository fills up and every future push is denied with "repository has reached
      # the maximum allowed number of images" (hit 2026-08-29, at ~43 images) — the deploy step above
      # succeeds at building the image but fails to push it, well before this step even runs. Keep
      # only the newest KEEP images so that failure mode can't recur. continue-on-error: a transient
      # registry-API hiccup here shouldn't turn an already-successful, already-verified-healthy deploy
      # into a failed workflow run.
      - name: Prune old container registry images
        continue-on-error: true
        run: |
          KEEP=7
          OLD_IMAGE_IDS=$(npx vercel vcr image ls dockerfile --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" --json \
            | jq -r --argjson keep "$KEEP" '.images | sort_by(.createdAt) | reverse | .[$keep:] | .[].id')
          if [ -z "$OLD_IMAGE_IDS" ]; then
            echo "Nothing to prune — $KEEP or fewer images in the repository."
            exit 0
          fi
          echo "$OLD_IMAGE_IDS" | while IFS= read -r image_id; do
            echo "Deleting old image $image_id"
            npx vercel vcr image rm dockerfile "$image_id" --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" --yes
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
