name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Lint
        working-directory: apps/docs
        run: npm run lint

      - name: Type check
        working-directory: apps/docs
        run: npm run types:check

      - name: Build
        working-directory: apps/docs
        run: npm run build

      # Deploy from the repo root (project Root Directory is already apps/docs).
      # Prefer remote deploy over `vercel build` + `--prebuilt` so Sensitive
      # project env vars stay available in Vercel's build container.
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_DOCS }}
