name: Deploy studio

on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            apps/studio/package-lock.json
            apps/docs/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Install dependencies
        working-directory: apps/studio
        run: npm ci

      # The published case-study journey starts the docs app and follows its
      # call to action into Studio. Install both applications before Playwright.
      - name: Install docs dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Lint
        working-directory: apps/studio
        run: npm run lint

      - name: Type check
        working-directory: apps/studio
        run: npm run types:check

      - name: Build
        working-directory: apps/studio
        run: npm run build

      # Playwright drives the real Monaco/LSP integration, so the language server
      # dll must exist on disk (server-bin/) before the e2e tests start the app.
      - name: Build language server
        working-directory: apps/studio
        run: npm run server:build

      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: apps/studio
        run: npm run test:e2e

      # Otherwise a failure is a bare assertion message with no way to see what the page actually
      # looked like or what network calls it made — this is what let case-study.spec.ts's real
      # (non-mocked) public-API dependency go undiagnosed across several failed runs.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/studio/playwright-report/
            apps/studio/test-results/
          retention-days: 7

      # Deploy from the repo root (project Root Directory is already apps/studio).
      # Do not use `vercel pull` + `vercel build` + `--prebuilt`: Sensitive project
      # env vars are not readable in CI and land as the literal "[SENSITIVE]"
      # placeholder, which breaks next.config basePath (NEXT_PUBLIC_STUDIO_BASE_PATH).
      # Remote deploy builds on Vercel, where those values are injected for real.
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STUDIO }}
