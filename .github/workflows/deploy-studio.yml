name: Deploy studio

on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        working-directory: apps/studio
        run: npm ci

      - name: Lint
        working-directory: apps/studio
        run: npm run lint

      - name: Type check
        working-directory: apps/studio
        run: npm run types:check

      - name: Build
        working-directory: apps/studio
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: apps/studio
        run: npm run test:e2e

      # Vercel CLI steps run from the repo root: the linked project already has its Root
      # Directory set to apps/studio, so cwd + Root Directory would otherwise double up
      # (apps/studio/apps/studio/package.json).
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STUDIO }}

      - name: Build on Vercel
        run: npx vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STUDIO }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STUDIO }}
