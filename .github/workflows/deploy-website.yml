name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Type check
        working-directory: apps/website
        run: npm run types:check

      - name: Build
        working-directory: apps/website
        run: npm run build

      # Deploy from the repo root (project Root Directory is already apps/website).
      # Do not use `vercel pull` + `vercel build` + `--prebuilt`: Sensitive project
      # env vars are not readable in CI and land as the literal "[SENSITIVE]"
      # placeholder, which breaks next.config rewrites that need STUDIO_DEPLOYMENT_URL.
      # Remote deploy builds on Vercel, where those values are injected for real.
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEBSITE }}
